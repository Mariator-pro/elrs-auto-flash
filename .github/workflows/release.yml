# A pushed tag like v0.2.0 builds the desktop app for macOS, Windows and Linux and attaches it to the GitHub release,
# together with the files the app's own update needs on Windows and Linux.
# The build (npm ci runs the install scripts of every dependency) may only read the repository; only the last job,
# which runs no code of the project or its dependencies, may write the release. Actions are pinned to a commit,
# so a moved tag cannot change what runs here; the version behind # is the one the commit had when pinned.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
        if: runner.os == 'macOS'
      - run: npm run build
      # macOS: ad-hoc signature (mac.identity "-" in package.json), no Apple certificate; Windows and Linux: unsigned
      - run: npx electron-builder ${{ matrix.target }} --publish never
      # Each installer in its own zip (the portable Windows app is a zip already): browsers warn far less about a zip than about an unsigned .exe
      - shell: pwsh
        if: runner.os != 'Linux'
        run: Get-ChildItem release/*.exe, release/*.dmg | ForEach-Object { Compress-Archive -Path $_.FullName -DestinationPath ($_.FullName -replace '\.(exe|dmg)$', '.zip') }
      # zip keeps the AppImage executable, Compress-Archive would not
      - if: runner.os == 'Linux'
        working-directory: release
        run: for f in *.AppImage; do zip "${f%.AppImage}.zip" "$f"; done
      # The bare installer, AppImage, block map and latest*.yml are what the app's own update downloads on Windows and Linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ runner.os }}
          path: |
            release/*.zip
            release/*.exe
            release/*.exe.blockmap
            release/*.AppImage
            release/latest.yml
            release/latest-linux.yml
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release/*
